<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="sytle.css" />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="blog-card">
        <img
          class="blog-card__image"
          src="./assets/images/illustration-article.svg"
          alt="Abstract illustration representing HTML and CSS"
        />
        <p class="blog-card__category">Learning</p>
        <p class="blog-card__date">
          Published <time datetime="2023-12-21">21 Dec 2023</time>
        </p>
        <h1>
          <a href="#">HTML & CSS foundations</a>
        </h1>
        <p class="blog-card__description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="blog-card__author">
          <img src="./assets/images/image-avatar.webp" alt="Greg Hooper" />
          <p>Greg Hooper</p>
        </div>
      </article>
    </main>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://github.com/felipesbelphman-web">Felipe Santos Belphman</a>.
    </footer>
  </body>
</html>
